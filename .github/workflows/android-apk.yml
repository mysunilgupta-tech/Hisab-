name: Hisab Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev typescript

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/

      - name: Install Capacitor packages
        run: |
          npm install @capacitor/core@7.4.0
          npm install @capacitor/cli@7.4.0
          npm install @capacitor/android@7.4.0

      - name: Create Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
